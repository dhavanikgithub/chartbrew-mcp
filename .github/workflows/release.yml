name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # lets you test the build from the Actions UI without releasing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run build:bin
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist-bin/*
          if-no-files-found: error

  release:
    needs: build
    # Only publish on a real tag push. workflow_dispatch builds but does not release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Requires manual approval — configure reviewers in
    # Settings → Environments → "release" → Required reviewers.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the tagged commit is on master
        run: |
          git fetch origin master
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/master'; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from master. Release aborted."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true
